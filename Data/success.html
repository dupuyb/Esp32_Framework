<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4CAF50">
    <title>Upload Successful</title>
    <style>
        :root {
            --primary: #4CAF50;
            --primary-dark: #45a049;
            --bg-light: #f5f5f5;
            --shadow: 0 2px 4px rgba(0, 0, 0, .1);
            --radius: 8px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: var(--bg-light);
            padding: 10px;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px;
            text-align: center;
        }

        header {
            border-bottom: 2px solid var(--primary);
            margin-bottom: 20px;
            padding-bottom: 10px;
        }

        h1 {
            background: linear-gradient(135deg, #87CEEB, var(--primary));
            color: #fff;
            padding: 15px;
            border-radius: 5px;
        }

        .message {
            margin: 20px 0;
            font-size: 1.1rem;
        }

        .button {
            display: inline-block;
            padding: 8px 16px;
            background: var(--primary);
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            transition: background 0.3s;
        }

        .button:hover {
            background: var(--primary-dark);
        }

        @media (max-width: 768px) {
            h1 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>HTML Uploader</h1>
        </header>
        <p class="message">The upload was successful.</p>
        <a class="button" href="/">Back</a>
    </div>
</body>
</html>
