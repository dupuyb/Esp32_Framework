; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ----------------------- ESP32 Dev Board -----------------------
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_flags =  -D PIO_ESP32_DEV_BOARD 
;               -D LOG_FRAMEWEB_ENABLED ; Enable debug output for FrameWeb (prefix [F])

monitor_port = /dev/tty.usbserial-14210
monitor_speed = 115200
upload_port = /dev/tty.usbserial-14210

; Partition options:
board_build.partitions = default.csv    ; app ~1.3MB + OTA  77.1% (used 1010241 bytes from 1310720 bytes)
;board_build.partitions = no_ota.csv     ; larger single app, no OTA
;board_build.partitions = min_spiffs.csv ; app + small SPIFFS
;board_build.partitions = huge_app.csv     ; max app size, no OTA (active)

; HTML-to-C++ generator
extra_scripts = pre:extra_script.py
; Single-file example (full HTML)
; custom_in_html = src/FrameWeb.html
; custom_out_h = src/FrameWeb.cpp
;
; Lightweight example (~50% flash gain depending on pages)
; custom_in_html = src/FrameLight.html
; custom_out_h = src/FrameWeb.cpp
;
; Multi-file example (sequential mapping input[i] -> output[i])
; custom_in_html = src/FrameLight.html
;                  src/FrameWeb.html
; custom_out_h = src/FrameWeb.cpp
;                src/FrameOther.cpp
;
custom_in_html = src/FrameWeb.html
custom_out_h = src/FrameWeb.cpp
custom_out_zip = zib 

lib_deps = # Using a library name
   https://github.com/tzapu/WiFiManager.git#master
   https://github.com/Links2004/arduinoWebSockets#master
   DNSServer
   WebServer
   ArduinoJson

; ----------------------- Seeed Xiao ESP32S3 -----------------------
